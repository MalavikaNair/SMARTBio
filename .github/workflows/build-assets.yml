name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install three
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i three@0.150.1

      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist
          # Copy site source into dist (exclude infra folders)
          rsync -av             --exclude '.git'             --exclude '.github'             --exclude 'node_modules'             ./ dist/

          # Ensure assets/js exists
          mkdir -p dist/assets/js

          # Copy ES module build + OrbitControls from node_modules
          cp node_modules/three/build/three.module.js dist/assets/js/three.module.js
          cp node_modules/three/examples/jsm/controls/OrbitControls.js dist/assets/js/OrbitControls.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
