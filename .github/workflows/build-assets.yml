name: build-assets
on:
  push:
    branches: [ main ]

permissions:
  contents: write   # allow the workflow to commit built files back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm i

      - name: Build Tailwind CSS
        run: npm run build:tailwind

      - name: Copy vendor JS locally
        run: npm run vendor:copy

      - name: Commit build artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/tailwind.css assets/js/*.js || true
          git commit -m "Build assets via Actions" || echo "No changes to commit"
          git push
