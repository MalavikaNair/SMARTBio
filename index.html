<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART Biomaterials - University of Oxford</title>
  <meta name="description" content="SMART Biomaterials Group at the University of Oxford - Engineering the future of medicine through intelligent materials that sense and respond to the body." />
  <meta property="og:title" content="SMART Biomaterials - University of Oxford" />
  <meta property="og:description" content="Engineering the future of medicine through intelligent materials that sense and respond to the body." />
  <meta property="og:type" content="website" />

  <!-- Styles -->
  <link rel="stylesheet" href="./assets/css/tailwind.css" />
  <link rel="stylesheet" href="./assets/css/fonts.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="antialiased" style="font-family: var(--font-sans-exo);">
  <script>
addEventListener('error', e => document.body.insertAdjacentHTML('afterbegin',
  '<pre style="padding:8px;border:1px solid #ccc">JS error: ' + (e.message || e.error) + '</pre>'));
addEventListener('unhandledrejection', e => document.body.insertAdjacentHTML('afterbegin',
  '<pre style="padding:8px;border:1px solid #ccc">Promise rejection: ' +
  (e.reason && (e.reason.stack || e.reason.message || e.reason)) + '</pre>'));
</script>
  <div id="particles-js" aria-hidden="true"></div>

  <!-- (Keep all your header, sections, and footer content from original) -->

  <!-- GDPR Transparency Banner -->
  <div id="gdpr-consent-banner"
       class="fixed bottom-0 left-0 right-0 bg-gray-800 text-white p-4 flex flex-col sm:flex-row items-center justify-between z-50 shadow-lg"
       style="display: none;"
       role="dialog"
       aria-live="polite"
       aria-label="Cookie and Privacy Notice">
    <p class="text-sm mb-2 sm:mb-0">
      This website itself does not use cookies or collect personal data.
      However, some embedded third-party services (e.g. YouTube videos or social media links) may set cookies or collect limited data.
      For details, see our <a href="#privacy" class="text-emerald-400 underline font-semibold">Privacy Notice</a>.
    </p>
    <button id="accept-cookies-btn"
            class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded-full text-sm transition duration-300">
      OK
    </button>
  </div>

  <!-- === JS === -->

  <!-- Three.js + OrbitControls (ES modules) -->
  <!-- This block exposes THREE and OrbitControls to window for your existing scripts -->
  
  <script type="module">
    import * as THREE from './assets/js/three.module.js';
    import { OrbitControls } from './assets/js/OrbitControls.js';
    window.THREE = THREE;
    window.OrbitControls = OrbitControls;
  </script>


  <!-- Vendor / app scripts (deferred) -->
  <script defer src="./assets/js/marked.min.js"></script>
  <script defer src="./assets/js/particles.min.js"></script>
  <script defer src="./researchHub.js"></script>
  <script defer src="./main.js"></script>

  <!-- GDPR Banner Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const banner = document.getElementById("gdpr-consent-banner");
      const acceptBtn = document.getElementById("accept-cookies-btn");
      const KEY = "gdprBannerDismissedAt";
      const DAYS_TO_RESHOW = 182;
      const dismissedAt = localStorage.getItem(KEY);
      const nowMs = Date.now();
      let show = true;
      if (dismissedAt) {
        const last = new Date(dismissedAt).getTime();
        const msWindow = DAYS_TO_RESHOW * 24 * 60 * 60 * 1000;
        show = (nowMs - last) >= msWindow;
      }
      if (show) banner.style.display = "flex";
      acceptBtn.addEventListener("click", () => {
        banner.style.display = "none";
        localStorage.setItem(KEY, new Date().toISOString());
      });
    });
  </script>
  <script>
(function() {
  function log(msg) {
    document.body.insertAdjacentHTML(
      'afterbegin',
      '<pre style="background:#fee;border:1px solid #c00;padding:8px;margin:0;font-size:14px;white-space:pre-wrap;">'
      + msg + '</pre>'
    );
  }

  // Catch JS runtime errors
  window.addEventListener('error', e => {
    log('JS error: ' + (e.message || e.error) +
        (e.filename ? '\nFile: ' + e.filename + ':' + e.lineno : ''));
  });

  // Catch unhandled promise rejections
  window.addEventListener('unhandledrejection', e => {
    log('Promise rejection: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason)));
  });

  // Catch failed resource/network requests
  const orig = console.error;
  console.error = function() {
    log('Console.error: ' + Array.from(arguments).join(' '));
    return orig.apply(console, arguments);
  };

  // For fetch / XHR errors
  const origFetch = window.fetch;
  window.fetch = function() {
    return origFetch.apply(this, arguments).catch(err => {
      log('Fetch failed: ' + err);
      throw err;
    });
  };
})();
</script>
</body>
</html>
